<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Content & Distribution - Post Mode</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Geist:wght@500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Hanken+Grotesk:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-primary-fixed-variant": "#564500",
                        "primary-fixed-dim": "#edc200",
                        "primary-container": "#fdd000",
                        "surface-container-lowest": "#0e0e0e",
                        "secondary-container": "#ffb700",
                        "surface-variant": "#353534",
                        "on-primary": "#3b2f00",
                        "surface-tint": "#edc200",
                        "surface-container": "#201f1f",
                        "error-container": "#93000a",
                        "on-secondary": "#422d00",
                        "secondary-fixed": "#ffdea9",
                        "tertiary-fixed": "#e5e2e0",
                        "surface-dim": "#131313",
                        "on-error-container": "#ffdad6",
                        "on-surface": "#e5e2e1",
                        "background": "#131313",
                        "on-primary-fixed": "#231b00",
                        "surface-container-low": "#1c1b1b",
                        "outline-variant": "#4d4632",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed-variant": "#484645",
                        "on-secondary-fixed": "#271900",
                        "outline": "#999077",
                        "secondary": "#ffdb9f",
                        "inverse-on-surface": "#313030",
                        "on-surface-variant": "#d1c6ab",
                        "on-secondary-container": "#6b4b00",
                        "tertiary": "#f4f0ee",
                        "on-background": "#e5e2e1",
                        "on-tertiary-container": "#5d5b5a",
                        "surface-container-highest": "#353534",
                        "surface-bright": "#3a3939",
                        "surface": "#131313",
                        "primary": "#fff0c8",
                        "surface-container-high": "#2a2a2a",
                        "inverse-primary": "#725c00",
                        "on-error": "#690005",
                        "tertiary-fixed-dim": "#c9c6c4",
                        "on-secondary-fixed-variant": "#5e4100",
                        "on-tertiary": "#31302f",
                        "secondary-fixed-dim": "#ffba26",
                        "on-primary-container": "#6e5900",
                        "inverse-surface": "#e5e2e1",
                        "tertiary-container": "#d7d4d2",
                        "primary-fixed": "#ffe07d",
                        "on-tertiary-fixed": "#1c1b1b"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        "base-unit": "4px",
                        "section-gap": "32px",
                        "gutter": "12px",
                        "container-padding": "20px",
                        "stack-gap": "16px"
                    },
                    fontFamily: {
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],
                        "mono-data": ["Geist"],
                        "label-caps": ["Geist"],
                        "body-sm": ["Hanken Grotesk"],
                        "title-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"]
                    },
                    fontSize: {
                        "headline-lg-mobile": ["28px", { lineHeight: "36px", fontWeight: "600" }],
                        "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "mono-data": ["13px", { lineHeight: "18px", fontWeight: "500" }],
                        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
                        "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "title-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "600" }]
                    }
                }
            }
        };
    </script>
<style>
        .glass-card {
            background-color: rgba(42, 41, 41, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid #444342;
            box-shadow: inset 1px 1px 0px rgba(255, 255, 255, 0.05);
        }
        .ai-pulse {
            animation: pulse-opacity 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-opacity {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-sm antialiased selection:bg-primary-container selection:text-on-primary-container min-h-screen pb-32">
<!-- Top Navigation Placeholder (Since Bottom Navigation is suppressed on task/transactional screens) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-surface-variant/30 flex items-center justify-between px-container-padding h-16">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-2 rounded-full hover:bg-surface-variant/20">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<span class="font-title-md text-title-md font-bold text-on-surface tracking-tight">Create Post</span>
<button class="text-primary hover:text-primary-container transition-colors flex items-center justify-center p-2 rounded-full hover:bg-primary/10">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
</button>
</header>
<main class="pt-24 px-container-padding max-w-md mx-auto space-y-section-gap">
<!-- Segmented Control -->
<div class="flex bg-surface-container-low p-1 rounded-full border border-surface-variant/50">
<button class="flex-1 py-2 text-center rounded-full bg-surface-variant/80 text-primary-container font-label-caps text-label-caps tracking-wider shadow-[0_2px_8px_rgba(0,0,0,0.2)] border border-[#444342] transition-all">POST</button>
<button class="flex-1 py-2 text-center rounded-full text-on-surface-variant font-label-caps text-label-caps tracking-wider hover:text-on-surface transition-colors">REEL</button>
</div>
<!-- Media Upload Area -->
<section class="glass-card rounded-xl p-container-padding space-y-stack-gap">
<h2 class="font-body-lg text-body-lg font-semibold text-on-surface">Media</h2>
<div class="grid grid-cols-3 gap-3">
<button class="aspect-square bg-surface-container rounded-lg border border-surface-variant/50 flex flex-col items-center justify-center text-on-surface-variant hover:border-primary/50 hover:text-primary transition-colors group">
<span class="material-symbols-outlined mb-2 text-2xl group-hover:scale-110 transition-transform" data-icon="image">image</span>
<span class="font-label-caps text-[10px]">Add Image</span>
</button>
<button class="aspect-square bg-surface-container rounded-lg border border-surface-variant/50 flex flex-col items-center justify-center text-on-surface-variant hover:border-primary/50 hover:text-primary transition-colors group">
<span class="material-symbols-outlined mb-2 text-2xl group-hover:scale-110 transition-transform" data-icon="imagesmode">imagesmode</span>
<span class="font-label-caps text-[10px]">Add Multiple</span>
</button>
<button class="aspect-square bg-surface-container rounded-lg border border-surface-variant/50 flex flex-col items-center justify-center text-on-surface-variant hover:border-primary/50 hover:text-primary transition-colors group">
<span class="material-symbols-outlined mb-2 text-2xl group-hover:scale-110 transition-transform" data-icon="videocam">videocam</span>
<span class="font-label-caps text-[10px]">Add Video</span>
</button>
</div>
</section>
<!-- Caption Editor -->
<section class="space-y-stack-gap relative">
<h2 class="font-body-lg text-body-lg font-semibold text-on-surface px-1">Caption</h2>
<div class="relative">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-secondary-container rounded-l-xl z-10 shadow-[0_0_12px_rgba(255,183,0,0.5)]"></div>
<textarea class="w-full bg-surface-container-low text-on-surface border border-surface-variant/50 rounded-xl p-4 pl-6 min-h-[120px] focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-sm placeholder:text-on-surface-variant/50 resize-none" placeholder="Write something engaging..."></textarea>
</div>
<div class="flex gap-3">
<button class="flex-1 flex items-center justify-center gap-2 py-2 px-4 bg-white/5 border border-white/10 rounded-full text-on-surface hover:bg-white/10 transition-colors font-label-caps text-label-caps">
<span class="w-1.5 h-1.5 bg-primary-container rounded-full ai-pulse shadow-[0_0_8px_rgba(253,208,0,0.8)]"></span>
                    Enhance with AI
                </button>
<button class="flex-1 flex items-center justify-center gap-2 py-2 px-4 bg-white/5 border border-white/10 rounded-full text-on-surface hover:bg-white/10 transition-colors font-label-caps text-label-caps">
<span class="material-symbols-outlined text-sm text-primary-container" data-icon="auto_awesome">auto_awesome</span>
                    Generate Caption
                </button>
</div>
</section>
<!-- Publish To -->
<section class="space-y-stack-gap">
<h2 class="font-body-lg text-body-lg font-semibold text-on-surface px-1">Publish To</h2>
<div class="grid grid-cols-2 gap-3">
<div class="glass-card rounded-lg p-3 flex items-center gap-3 cursor-pointer border-primary/50 bg-primary/5">
<div class="w-8 h-8 rounded-full bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-500 flex items-center justify-center p-[2px]">
<div class="w-full h-full bg-surface rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-sm text-on-surface" data-icon="photo_camera">photo_camera</span>
</div>
</div>
<div class="flex-1 min-w-0">
<div class="font-mono-data text-mono-data truncate">@alexrivers_exec</div>
<div class="text-[10px] text-primary">Instagram</div>
</div>
<span class="material-symbols-outlined text-primary text-lg" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="glass-card rounded-lg p-3 flex items-center gap-3 cursor-pointer hover:border-surface-variant transition-colors opacity-70">
<div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm">
                        in
                    </div>
<div class="flex-1 min-w-0">
<div class="font-mono-data text-mono-data truncate">Alex Rivers</div>
<div class="text-[10px] text-on-surface-variant">LinkedIn</div>
</div>
</div>
</div>
</section>
<!-- Timing -->
<section class="glass-card rounded-xl p-container-padding space-y-stack-gap">
<div class="flex items-center justify-between">
<h2 class="font-body-lg text-body-lg font-semibold text-on-surface">Timing</h2>
<div class="flex bg-surface-container-low p-1 rounded-lg border border-surface-variant/50">
<button class="px-4 py-1.5 rounded-md bg-surface-variant/80 text-primary-container font-label-caps text-label-caps tracking-wider shadow-sm border border-[#444342]">Now</button>
<button class="px-4 py-1.5 rounded-md text-on-surface-variant font-label-caps text-label-caps tracking-wider hover:text-on-surface transition-colors">Schedule</button>
</div>
</div>
<div class="text-sm text-on-surface-variant border-t border-surface-variant/30 pt-4 flex items-center gap-2">
<span class="material-symbols-outlined text-secondary-container" data-icon="bolt">bolt</span>
                AI recommends posting between <span class="text-primary font-mono-data">2:00 PM - 4:00 PM</span> today for optimal reach.
            </div>
</section>
<!-- Expandable Settings -->
<section class="space-y-2">
<button class="w-full glass-card rounded-lg p-4 flex items-center justify-between hover:bg-surface-variant/10 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="tag">tag</span>
<span class="font-body-sm text-on-surface">Hashtags</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full glass-card rounded-lg p-4 flex items-center justify-between hover:bg-surface-variant/10 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="link">link</span>
<span class="font-body-sm text-on-surface">Link / CTA</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full glass-card rounded-lg p-4 flex items-center justify-between hover:bg-surface-variant/10 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="location_on">location_on</span>
<span class="font-body-sm text-on-surface">Location</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
</section>
</main>
<!-- Sticky Bottom CTA -->
<div class="fixed bottom-0 left-0 right-0 p-container-padding bg-gradient-to-t from-background via-background/90 to-transparent z-50">
<div class="max-w-md mx-auto">
<button class="w-full py-4 rounded-full bg-primary-container text-on-primary font-title-md text-title-md font-bold shadow-[0_4px_14px_0_rgba(253,208,0,0.39)] hover:scale-[1.02] active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
                Review & Distribute
                <span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</div>
</div>
</body></html>
