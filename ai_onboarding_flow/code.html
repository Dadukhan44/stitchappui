<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Sales Agent - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Geist:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#201f1f",
                        "surface-container-high": "#2a2a2a",
                        "surface-variant": "#353534",
                        "surface-dim": "#131313",
                        "tertiary-fixed-dim": "#c9c6c4",
                        "on-error-container": "#ffdad6",
                        "outline-variant": "#4d4632",
                        "inverse-surface": "#e5e2e1",
                        "tertiary": "#f4f0ee",
                        "on-tertiary-container": "#5d5b5a",
                        "on-secondary-fixed-variant": "#5e4100",
                        "outline": "#999077",
                        "secondary": "#ffdb9f",
                        "surface-tint": "#edc200",
                        "on-surface": "#e5e2e1",
                        "on-secondary-fixed": "#271900",
                        "surface-container-lowest": "#0e0e0e",
                        "inverse-primary": "#725c00",
                        "on-primary-fixed-variant": "#564500",
                        "on-background": "#e5e2e1",
                        "surface-container-low": "#1c1b1b",
                        "background": "#131313",
                        "on-secondary-container": "#6b4b00",
                        "on-tertiary-fixed-variant": "#484645",
                        "surface": "#131313",
                        "surface-bright": "#3a3939",
                        "primary": "#fff0c8",
                        "secondary-fixed-dim": "#ffba26",
                        "on-tertiary-fixed": "#1c1b1b",
                        "inverse-on-surface": "#313030",
                        "error-container": "#93000a",
                        "on-primary-container": "#6e5900",
                        "secondary-container": "#ffb700",
                        "on-tertiary": "#31302f",
                        "surface-container-highest": "#353534",
                        "on-secondary": "#422d00",
                        "primary-container": "#fdd000",
                        "tertiary-container": "#d7d4d2",
                        "primary-fixed-dim": "#edc200",
                        "error": "#ffb4ab",
                        "on-error": "#690005",
                        "primary-fixed": "#ffe07d",
                        "on-primary": "#3b2f00",
                        "secondary-fixed": "#ffdea9",
                        "tertiary-fixed": "#e5e2e0",
                        "on-primary-fixed": "#231b00",
                        "on-surface-variant": "#d1c6ab"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap": "16px",
                        "base-unit": "4px",
                        "section-gap": "32px",
                        "container-padding": "20px",
                        "gutter": "12px"
                    },
                    "fontFamily": {
                        "body-lg": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "label-caps": ["Geist"],
                        "display-lg": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "mono-data": ["Geist"],
                        "title-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "mono-data": ["13px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ai-pulse {
            animation: pulse-glow 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        .glass-card {
            background-color: rgba(42, 41, 41, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(68, 67, 66, 1);
            box-shadow: inset 1px 1px 0px 0px rgba(255, 255, 255, 0.05);
        }
        
        /* Hide steps for smooth transition demo */
        .onboarding-step {
            display: none;
        }
        .onboarding-step.active {
            display: flex;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Background Atmospheric Glow -->
<div class="absolute inset-0 z-0 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary-container/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-secondary-container/5 blur-[100px]"></div>
</div>
<!-- Onboarding Container -->
<main class="w-full max-w-md mx-auto px-container-padding py-section-gap z-10 flex-grow flex flex-col justify-center h-full min-h-[884px]">
<!-- Progress Indicators -->
<div class="flex justify-center gap-2 mb-section-gap">
<div class="h-2 w-8 rounded-full bg-primary-container transition-all duration-300" id="dot-1"></div>
<div class="h-2 w-2 rounded-full bg-surface-variant transition-all duration-300" id="dot-2"></div>
<div class="h-2 w-2 rounded-full bg-surface-variant transition-all duration-300" id="dot-3"></div>
</div>
<!-- STEP 1: Welcome -->
<div class="onboarding-step active flex-col gap-stack-gap animate-[fadeIn_0.5s_ease-out]" id="step-1">
<div class="glass-card rounded-xl p-section-gap flex flex-col items-center justify-center text-center aspect-square mb-stack-gap relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-br from-primary-container/10 to-transparent opacity-50 group-hover:opacity-100 transition-opacity duration-500"></div>
<div class="relative z-10">
<span class="material-symbols-outlined text-[80px] text-primary-container mb-4 filter drop-shadow-[0_0_15px_rgba(253,208,0,0.4)]" style="font-variation-settings: 'FILL' 1;">
                        hub
                    </span>
<div class="ai-pulse absolute top-0 right-0 w-3 h-3 bg-primary-container rounded-full shadow-[0_0_10px_rgba(253,208,0,0.8)]"></div>
</div>
</div>
<div class="text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-2 tracking-tight">Your AI Sales Agent</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Find better prospects. Start conversations. Know who is ready to talk.</p>
</div>
<div class="mt-auto pt-section-gap">
<button class="w-full bg-primary-container text-on-primary font-title-md text-title-md py-4 px-6 rounded-full shadow-[0_4px_14px_0_rgba(253,208,0,0.39)] hover:bg-primary-fixed hover:scale-[1.02] transition-all duration-200 flex items-center justify-center gap-2" onclick="nextStep(2)">
                    Get Started
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
<!-- STEP 2: Connect Accounts -->
<div class="onboarding-step flex-col gap-stack-gap animate-[fadeIn_0.5s_ease-out]" id="step-2">
<div class="text-center mb-section-gap">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2 tracking-tight">Connect accounts</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Link your channels for the AI to analyze and prospect.</p>
</div>
<div class="grid grid-cols-2 gap-gutter">
<!-- LinkedIn -->
<button class="glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-highest transition-colors group relative overflow-hidden">
<div class="w-12 h-12 rounded-full bg-surface-dim flex items-center justify-center border border-outline-variant/30 group-hover:border-primary-container/50 transition-colors">
<span class="material-symbols-outlined text-on-surface text-[24px]">work</span>
</div>
<span class="font-mono-data text-mono-data text-on-surface">LinkedIn</span>
<span class="material-symbols-outlined text-on-surface-variant text-[16px] absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity">add_circle</span>
</button>
<!-- Instagram -->
<button class="glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-highest transition-colors group relative overflow-hidden">
<div class="w-12 h-12 rounded-full bg-surface-dim flex items-center justify-center border border-outline-variant/30 group-hover:border-primary-container/50 transition-colors">
<span class="material-symbols-outlined text-on-surface text-[24px]">photo_camera</span>
</div>
<span class="font-mono-data text-mono-data text-on-surface">Instagram</span>
<span class="material-symbols-outlined text-on-surface-variant text-[16px] absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity">add_circle</span>
</button>
<!-- WhatsApp -->
<button class="glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-highest transition-colors group relative overflow-hidden">
<div class="w-12 h-12 rounded-full bg-surface-dim flex items-center justify-center border border-outline-variant/30 group-hover:border-primary-container/50 transition-colors">
<span class="material-symbols-outlined text-on-surface text-[24px]">chat</span>
</div>
<span class="font-mono-data text-mono-data text-on-surface">WhatsApp</span>
<span class="material-symbols-outlined text-on-surface-variant text-[16px] absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity">add_circle</span>
</button>
<!-- Email -->
<button class="glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-highest transition-colors group relative overflow-hidden">
<div class="w-12 h-12 rounded-full bg-surface-dim flex items-center justify-center border border-outline-variant/30 group-hover:border-primary-container/50 transition-colors">
<span class="material-symbols-outlined text-on-surface text-[24px]">mail</span>
</div>
<span class="font-mono-data text-mono-data text-on-surface">Email</span>
<span class="material-symbols-outlined text-on-surface-variant text-[16px] absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity">add_circle</span>
</button>
</div>
<div class="mt-auto pt-section-gap flex gap-gutter">
<button class="w-1/3 bg-white/10 text-white font-title-md text-title-md py-4 px-4 rounded-full border border-white/20 hover:bg-white/20 transition-all duration-200" onclick="nextStep(1)">
                    Back
                </button>
<button class="w-2/3 bg-primary-container text-on-primary font-title-md text-title-md py-4 px-6 rounded-full shadow-[0_4px_14px_0_rgba(253,208,0,0.39)] hover:bg-primary-fixed hover:scale-[1.02] transition-all duration-200" onclick="nextStep(3)">
                    Continue
                </button>
</div>
</div>
<!-- STEP 3: Define Ideal Customer -->
<div class="onboarding-step flex-col gap-stack-gap animate-[fadeIn_0.5s_ease-out]" id="step-3">
<div class="text-center mb-stack-gap">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2 tracking-tight">Define ideal customer</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Help the AI focus on high-value targets.</p>
</div>
<div class="glass-card rounded-xl p-container-padding flex flex-col gap-stack-gap">
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant">Industry</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">domain</span>
<input class="w-full bg-background border border-outline-variant/50 rounded-lg py-3 pl-10 pr-4 text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" placeholder="e.g. SaaS, Finance, Healthcare" type="text"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant">Role</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">badge</span>
<input class="w-full bg-background border border-outline-variant/50 rounded-lg py-3 pl-10 pr-4 text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" placeholder="e.g. CMO, VP Sales, Founder" type="text"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant">Location</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">location_on</span>
<input class="w-full bg-background border border-outline-variant/50 rounded-lg py-3 pl-10 pr-4 text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" placeholder="e.g. North America, Remote" type="text"/>
</div>
</div>
</div>
<div class="mt-auto pt-section-gap flex gap-gutter">
<button class="w-1/3 bg-white/10 text-white font-title-md text-title-md py-4 px-4 rounded-full border border-white/20 hover:bg-white/20 transition-all duration-200" onclick="nextStep(2)">
                    Back
                </button>
<button class="w-2/3 bg-primary-container text-on-primary font-title-md text-title-md py-4 px-6 rounded-full shadow-[0_4px_14px_0_rgba(253,208,0,0.39)] hover:bg-primary-fixed hover:scale-[1.02] transition-all duration-200 flex items-center justify-center gap-2 relative overflow-hidden group">
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 rounded-full"></div>
<span class="relative z-10 flex items-center gap-2">
                        Start Building Leads
                        <span class="material-symbols-outlined text-[20px]">bolt</span>
</span>
</button>
</div>
</div>
</main>
<script>
        function nextStep(step) {
            // Hide all steps
            document.querySelectorAll('.onboarding-step').forEach(el => {
                el.classList.remove('active');
            });
            
            // Show target step
            document.getElementById(`step-${step}`).classList.add('active');

            // Update dots
            for(let i=1; i<=3; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if(i === step) {
                    dot.className = "h-2 w-8 rounded-full bg-primary-container transition-all duration-300";
                } else {
                    dot.className = "h-2 w-2 rounded-full bg-surface-variant transition-all duration-300";
                }
            }
        }
    </script>
</body></html>
